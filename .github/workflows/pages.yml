name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      whatsapp_provider:
        description: WhatsApp provider for this manual build only
        type: choice
        options:
          - meta
          - waha
        default: meta
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build Flutter Web
        env:
          NETAGENT_WHATSAPP_PROVIDER: ${{ github.event_name == 'workflow_dispatch' && inputs.whatsapp_provider || 'meta' }}
          WAHA_GATEWAY_URL: ${{ vars.WAHA_GATEWAY_URL || 'https://netagentiraq.duckdns.org' }}
        run: |
          case "$NETAGENT_WHATSAPP_PROVIDER" in
            meta|waha) ;;
            *) echo "Unsupported WhatsApp provider" >&2; exit 1 ;;
          esac

          if [ "$NETAGENT_WHATSAPP_PROVIDER" = "waha" ]; then
            case "$WAHA_GATEWAY_URL" in
              https://*) ;;
              *) echo "WAHA_GATEWAY_URL must be an HTTPS URL when WAHA is selected" >&2; exit 1 ;;
            esac
          fi

          flutter build web --release --base-href /ha/ \
            --dart-define="NETAGENT_WHATSAPP_PROVIDER=$NETAGENT_WHATSAPP_PROVIDER" \
            --dart-define="WAHA_GATEWAY_URL=$WAHA_GATEWAY_URL"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Flutter Web
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4