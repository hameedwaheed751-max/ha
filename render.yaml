services:
  - type: web
    name: netagent-sas-proxy
    env: node
    branch: master
    rootDir: web_proxy
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Host-specific TLS bypass: only these SAS hosts will use rejectUnauthorized:false
      # when the Worker routes traffic through this proxy. Other sites use strict TLS.
      - key: SAS_INSECURE_HOSTS
        value: "sas.speednet-iq.com,reseller.dishtele.com,reseller.nbtel.iq,reseller.nbtle.iq,reseller.nbtele.iq,s3.nbtel.iq"
      # Global TLS verification is now handled per-host by the proxy.
      - key: ALLOW_INSECURE_TLS
        value: "1"
      # Permit legacy SAS installations that expose HTTP instead of HTTPS.
      - key: ALLOW_HTTP_TARGETS
        value: "1"
      - key: SAS_TARGET_ALLOWLIST
        value: ""
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        value: "2247793002705802"
      # Required for WhatsApp Cloud API webhook verification
      # - key: WHATSAPP_VERIFY_TOKEN
      #   value: your-verify-token
      # Required for WhatsApp Cloud API sending
      # - key: WHATSAPP_ACCESS_TOKEN
      #   value: your-access-token
      # - key: WHATSAPP_PHONE_NUMBER_ID
      #   value: your-phone-number-id
      # Optional
      # - key: SAS_TARGET_URL
      #   value: https://sas.speednet-iq.com
      # - key: PROXY_TOKEN
      #   value: your-secret-token-here
