services:
  waha:
    image: devlikeapro/waha:gows-2026.9.2
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    expose:
      - "3000"
    environment:
      WHATSAPP_DEFAULT_ENGINE: GOWS
      GODEBUG: netdns=go
      WAHA_API_KEY: "sha512:${WAHA_API_KEY_SHA512:?Set WAHA_API_KEY_SHA512 in the untracked .env file}"
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
      WAHA_LOCAL_STORE_BASE_DIR: /app/.sessions
    volumes:
      - ./data/sessions:/app/.sessions

  gateway:
    build:
      context: ./gateway
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      PORT: "3001"
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID:?Set FIREBASE_PROJECT_ID in the untracked .env file}"
      FIREBASE_DATABASE_URL: "https://wakeiq-4b97b-default-rtdb.europe-west1.firebasedatabase.app"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
      WAHA_BASE_URL: http://waha:3000
      WAHA_API_KEY: "${WAHA_GATEWAY_API_KEY:?Set a newly rotated WAHA_GATEWAY_API_KEY in the untracked .env file}"
      WAHA_SESSION_NAME: "${WAHA_SESSION_NAME:?Set the existing central WAHA session name in the untracked .env file}"
      WAHA_IDEMPOTENCY_FILE: /app/data/idempotency.json
      WAHA_TIMEOUT_MS: "15000"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
    volumes:
      - ./gateway/secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
      - ./gateway/data:/app/data
    depends_on:
      - waha
