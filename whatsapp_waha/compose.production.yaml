name: netagent-waha-production

services:
  gateway:
    image: netagent-waha-gateway:local
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    expose:
      - "3001"
    environment:
      PORT: "3001"
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID:?Set FIREBASE_PROJECT_ID in /opt/gateway/.env}"
      FIREBASE_DATABASE_URL: "${FIREBASE_DATABASE_URL:?Set FIREBASE_DATABASE_URL in /opt/gateway/.env}"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
      WAHA_BASE_URL: http://netagent-waha:3000
      WAHA_API_KEY: "${WAHA_GATEWAY_API_KEY:?Set the existing WAHA API key in /opt/gateway/.env}"
      WAHA_IDEMPOTENCY_FILE: /app/data/idempotency.json
      WAHA_TIMEOUT_MS: "15000"
      CORS_ALLOWED_ORIGINS: "${NETAGENT_WEB_ORIGIN:?Set the existing exact NetAgent web origin(s) in /opt/gateway/.env},https://wakeel-unel.onrender.com"
      CORS_ALLOW_LOCALHOST_ORIGINS: "false"
    volumes:
      - ./gateway/secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
      - ./gateway/data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - waha_existing

  caddy:
    image: caddy:2.10-alpine
    profiles:
      - public-https
    restart: unless-stopped
    init: true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WAHA_GATEWAY_HOST: "${WAHA_GATEWAY_HOST:?Set the public IP or hostname in /opt/gateway/.env}"
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - waha_existing
    depends_on:
      - gateway

volumes:
  caddy_data:
  caddy_config:

networks:
  waha_existing:
    external: true
    name: netagent-waha_default
